name: WebnovelReader
options:
  bundleIdPrefix: dev.yanglong
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "R5U3W3463A"
    CODE_SIGN_STYLE: Automatic

targets:
  WebnovelReader:
    type: application
    platform: iOS
    sources:
      - path: WebnovelReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yanglong.webnovelreader
        PRODUCT_NAME: "WebnovelReader"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Generated-Info.plist
      properties:
        CFBundleDisplayName: "WebnovelReader"
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

  WebnovelReaderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WebnovelReaderUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yanglong.webnovelreader.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WebnovelReader
    dependencies:
      - target: WebnovelReader
