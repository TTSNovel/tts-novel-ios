name: WebnovelReader
options:
  bundleIdPrefix: dev.yanglong
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    watchOS: "10.0"
  createIntermediateGroups: true

# SERVER_BASE_URL comes from Config.xcconfig (gitignored, personal deployment
# — see Config.xcconfig.example) so it's not committed as a source literal.
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "R5U3W3463A"
    CODE_SIGN_STYLE: Automatic

packages:
  # No tagged release of this repo has ever included Package.swift (it
  # only exists on the `master` branch — confirmed via `git tag
  # --contains` on the commit that added it) — version/exactVersion
  # resolution always fails with "the package manifest at '/Package.swift'
  # cannot be accessed", so pin a specific commit instead of a version.
  SherpaOnnx:
    url: https://github.com/k2-fsa/sherpa-onnx
    revision: 634265c9b57642fdd158120148785c89aa281c4b
  # ONNX Runtime C/C++ headers+binary for the VieNeu-Codec decode step
  # (VieNeuV2CodecONNX.mm, and the VieNeuOfflineV3 pipeline) — sherpa-onnx's bundled ORT only exposes its own
  # high-level VITS/Kokoro-style pipelines, not a raw session API, so this
  # needs its own session. Deliberately the *same* package+exact version
  # SherpaOnnx itself pins (see its Package.swift) rather than Microsoft's
  # onnxruntime-swift-package-manager (which also wraps this same repo,
  # but at a different exact version) — two different exact-pinned copies
  # of onnxruntime-libs both produce a binary literally named
  # "onnxruntime.framework", which collided at the app's embed-frameworks
  # step ("Multiple commands produce onnxruntime.framework") until this
  # was pinned to match and let SPM unify them into one shared instance.
  onnxruntime-libs:
    url: https://github.com/csukuangfj/onnxruntime-libs
    exactVersion: 1.27.1
  # Local package holding the platform-portable core (Models, Networking,
  # Progress, Security, TTSVoice/GwenTTSSpeaker, TranslationEngine) shared
  # by the iOS, macOS, and watchOS app targets — see Packages/Core/Package.swift.
  Core:
    path: Packages/Core

targets:
  WebnovelReader:
    type: application
    platform: iOS
    # Offline TTS/G2P/translation model binaries live in GCS, not git (see
    # Scripts/fetch-models.sh) — fetched here before Sources/Resources are
    # compiled/copied, so they exist on disk by the time later build phases
    # need them. basedOnDependencyAnalysis: false because the script's own
    # per-file existence check is the skip logic; Xcode's new build system
    # otherwise sometimes skips scripts it thinks have no changed inputs.
    prebuildScripts:
      - path: Scripts/fetch-models.sh
        name: "Fetch offline models (GCS)"
        basedOnDependencyAnalysis: false
    sources:
      # espeak-ng-data must stay a real subdirectory at runtime (espeak
      # reads many files inside it by relative path) — added separately
      # below as a folder reference (type: folder) instead of letting the
      # default recursive group pick it up, which would just flatten
      # every file inside it to the bundle root like any other resource.
      # VieNeuOfflineV3 is also kept as a real subdirectory — unlike V2's
      # loose (flattened) resource files, several of V3's 14 preset-voice
      # filenames collide with V2's own (both ship a "voice_pham_tuyen.json"
      # etc. with different content) — a folder reference keeps the two
      # bundles namespaced apart instead of one silently clobbering the
      # other at the flat bundle root.
      - path: WebnovelReader
        excludes:
          - "Resources/PiperOffline/espeak-ng-data/**"
          - "Resources/VieNeuOfflineV3/**"
      - path: WebnovelReader/Resources/PiperOffline/espeak-ng-data
        type: folder
        buildPhase: resources
      - path: WebnovelReader/Resources/VieNeuOfflineV3
        type: folder
        buildPhase: resources
    dependencies:
      - package: SherpaOnnx
        product: sherpa-onnx
      - package: onnxruntime-libs
        product: onnxruntime-ios
      - package: Core
      # Vendored (see WebnovelReader/Vendor/*/README-ish doc comments in
      # the TTS/VieNeuOfflineV2 sources for how each was built): SeaG2P is a
      # static lib (sea-g2p Rust core, PyO3 stripped, shared by both V2 and
      # V3 offline pipelines); llama is the stock mainline llama.cpp dynamic
      # xcframework (device + sim slices only), used only by V2's GGUF
      # backbone — V3 is pure ONNX, no llama.cpp involved.
      - framework: WebnovelReader/Vendor/SeaG2P.xcframework
        embed: false
      - framework: WebnovelReader/Vendor/llama.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yanglong.webnovelreader
        PRODUCT_NAME: "WebnovelReader"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_OBJC_BRIDGING_HEADER: WebnovelReader/TTS/VieNeu-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    info:
      path: Generated-Info.plist
      properties:
        CFBundleDisplayName: "Novel Reader"
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        SERVER_BASE_URL: "$(SERVER_BASE_URL)"

  WebnovelReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WebnovelReaderTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yanglong.webnovelreader.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WebnovelReader
    dependencies:
      - target: WebnovelReader
      - package: Core

  WebnovelReaderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WebnovelReaderUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yanglong.webnovelreader.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WebnovelReader
    dependencies:
      - target: WebnovelReader

  # Scaffold phase: online TTS only (WebnovelReaderOnlineSynthesizer, see
  # ReaderPlaybackController) — the offline Piper/VieNeu engines need a
  # macOS slice of their vendored xcframeworks (llama.xcframework,
  # SeaG2P.xcframework) before they can be wired in here, tracked as a
  # follow-up phase once those exist. Offline chapter translation
  # (OpusMTTranslationEngine) IS included, via onnxruntime-macos — that
  # package already ships a macOS product, unlike the two TTS xcframeworks.
  WebnovelReaderMac:
    type: application
    platform: macOS
    sources:
      - path: WebnovelReaderMac
      - path: WebnovelReader/App
        excludes:
          # WatchConnectivity is iOS/watchOS only, not plain (non-Catalyst)
          # macOS — the iPhone-side half of the watch login handoff.
          - "WatchSessionRelay.swift"
      - path: WebnovelReader/Resources/Assets.xcassets
      - path: WebnovelReader/Views
        excludes:
          - "ChapterPagerView.swift"
      - path: WebnovelReader/Audio
      - path: WebnovelReader/Download
      - path: WebnovelReader/Translation
        excludes:
          - "BundledTranslation/**"
      - path: WebnovelReader/TTS
        excludes:
          - "PiperOfflineTTSService.swift"
          - "SeaG2PBridge.swift"
          - "OfflineWavEncoding.swift"
          - "WebnovelReaderFullSynthesizer.swift"
          - "VieNeu-Bridging-Header.h"
          - "VieNeuOfflineV2/**"
          - "VieNeuOfflineV3/**"
    dependencies:
      - package: Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yanglong.webnovelreader.mac
        PRODUCT_NAME: "Novel Reader"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: WebnovelReaderMac/WebnovelReaderMac.entitlements
    info:
      path: Generated-Info-Mac.plist
      properties:
        CFBundleDisplayName: "Novel Reader"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        SERVER_BASE_URL: "$(SERVER_BASE_URL)"

  WebnovelReaderMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: WebnovelReaderMacUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yanglong.webnovelreader.mac.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WebnovelReaderMac
    dependencies:
      - target: WebnovelReaderMac

  # Online TTS only, no offline voices/translation — see
  # WatchPlaybackController's doc comment (no watchOS slice for the
  # offline-TTS xcframeworks, no watchOS onnxruntime product or
  # Translation-framework support). Everything else (voice picker,
  # downloads, chapter list/search, history, login) is real feature
  # parity with iOS, reusing whichever iOS views/utilities were already
  # platform-decoupled (LoginView, ActionHistoryView, BugReportView,
  # ChapterListSheet, ChapterTitles, BookRow, CoverImage — see each file's
  # own doc comment) rather than forking them; only the Watch-specific
  # screens live under WebnovelReaderWatch/.
  WebnovelReaderWatch:
    type: application
    platform: watchOS
    sources:
      - path: WebnovelReaderWatch
      - path: WebnovelReader/Audio
      - path: WebnovelReader/Download
      - path: WebnovelReader/Views/LoginView.swift
      - path: WebnovelReader/Views/ActionHistoryView.swift
      - path: WebnovelReader/Views/BugReportView.swift
      - path: WebnovelReader/Views/ChapterListSheet.swift
      - path: WebnovelReader/Views/ChapterTitles.swift
      - path: WebnovelReader/Views/BookRow.swift
      - path: WebnovelReader/Views/CoverImage.swift
      - path: WebnovelReader/Views/CrossPlatformToolbar.swift
    dependencies:
      - package: Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yanglong.webnovelreader.watch
        PRODUCT_NAME: "Novel Reader"
        TARGETED_DEVICE_FAMILY: "4"
    info:
      path: Generated-Info-Watch.plist
      properties:
        CFBundleDisplayName: "Novel Reader"
        WKApplication: true
        WKBackgroundModes:
          - audio
        WKCompanionAppBundleIdentifier: dev.yanglong.webnovelreader
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        SERVER_BASE_URL: "$(SERVER_BASE_URL)"

  WebnovelReaderWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: WebnovelReaderWatchUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yanglong.webnovelreader.watch.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WebnovelReaderWatch
    dependencies:
      - target: WebnovelReaderWatch

schemes:
  WebnovelReader:
    build:
      targets:
        WebnovelReader: all
        WebnovelReaderUITests: [test]
        WebnovelReaderTests: [test]
    test:
      targets:
        - WebnovelReaderUITests
        - WebnovelReaderTests
    run:
      config: Debug
    shared: true

  WebnovelReaderMac:
    build:
      targets:
        WebnovelReaderMac: all
        WebnovelReaderMacUITests: [test]
    test:
      targets:
        - WebnovelReaderMacUITests
    run:
      config: Debug
    shared: true

  WebnovelReaderWatch:
    build:
      targets:
        WebnovelReaderWatch: all
        WebnovelReaderWatchUITests: [test]
    test:
      targets:
        - WebnovelReaderWatchUITests
    run:
      config: Debug
    shared: true
